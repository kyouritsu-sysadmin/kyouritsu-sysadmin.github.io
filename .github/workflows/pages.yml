name: Build and publish company site

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: company-site-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: my-docs/package-lock.json
      - name: Install document library dependencies
        run: npm --prefix my-docs ci
      - name: Build and validate homepage and manuals
        run: npm run build
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name == 'workflow_dispatch'
        with:
          path: _site

  deploy:
    needs: build
    if: github.event_name == 'workflow_dispatch' && github.ref == format('refs/heads/{0}', github.event.repository.default_branch) && github.event.repository.name == format('{0}.github.io', github.repository_owner)
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
